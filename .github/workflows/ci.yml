name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check ctsegdose_core tests tools
      - name: Test
        run: pytest --cov=ctsegdose_core --cov-report=term-missing

  reported-numbers-are-re-derivable:
    # The selection is only auditable if its reported counts follow from its rows. This
    # job re-derives every keep/drop verdict from the header evidence stored beside it,
    # and every total from the per-series records, so a summary edited by hand fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_results_integrity.py tests/test_data_hygiene.py
